- name: configure payment server
  hosts: payment
  become: yes
  tasks:
    - name: install python3 gcc python3-devel
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      loop:
          - python3
          - gcc
          - python3-devel

    - name: Create roboshop system user
      ansible.builtin.user:
        name: roboshop
        system: true
        home: /app
        shell: /sbin/nologin
        comment: "roboshop system user"
        state: present

    - name: create directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download payment
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
        dest: /tmp/payment.zip

    - name: Download payment
      ansible.builtin.unarchive:
        src: /tmp/payment.zip
        dest: /app
        remote_src: yes

    - name: install dependencies
      ansible.builtin.pip:
          requirements: requirements.txt
          executable: pip3.9
      args:
          chdir: /app

    - name: copying payment service
      ansible.builtin.copy:
        src: payment.service
        dest: /etc/systemd/system/payment.service

    - name: daemon_reload payment/systemctl daemon reload
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: start and enable payment
      ansible.builtin.service:
        name: payment
        state: started
        enabled: yes
